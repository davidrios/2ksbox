[package]
name = "qtmin"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The smallest cxx-qt binary that can be cross-built for Windows, in three rungs."
[workspace]

[[bin]]
name = "qtmin"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[features]
# The rungs, low to high. Default is the lowest that still links Qt.
default = []
# a QObject through a cxx-qt bridge (moc + generated C++, no QML module)
bridge = []
# a QML module: qmltyperegistrar, the .qml compiled into a resource, and
# the type registration that runs before main
qml = ["bridge"]
