# The Flatpak (M6 step 6b, doc 07's primary Linux target).
#
#   scripts/package-flatpak.sh          build + install + a smoke check
#
# Why a Flatpak at all: our QEMU is a patch queue, so no distro's `qemu`
# can ever be linked, and `libqemu-embed-i386.so` pulls ~191 shared
# libraries that the plain tarball ships none of. A runtime supplies
# exactly that set on every distro. The sandbox is a secondary benefit
# here and a fairly nominal one — see `finish-args` below.
#
# The binaries MUST be built inside the SDK: the host's glibc is newer
# than the runtime's (2.44 vs 2.42 as of writing) and our embed library
# already references GLIBC_2.43, so host-built binaries will not run here.
#
# The runtime is KDE's, not freedesktop's, and that is the whole of what
# ADR-015 costs this package: the launcher is Qt 6 / QML (`launcher-qt`),
# `org.kde.Platform` ships Qt and `org.freedesktop.Platform` does not, and
# the alternative — building Qt as a module of this manifest — is hours of
# build for a copy of what a runtime already has. 6.10 is a thin layer on
# `org.freedesktop.Platform` 25.08, the base this manifest used directly
# before, so nothing else about the build changes: same glibc, same
# `org.freedesktop.Sdk.Extension.rust-stable//25.08`, same Python 3.13 for
# QEMU's configure.
app-id: com._2ksbox.Launcher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: 2ksbox

finish-args:
  # A machine is the point of the app: KVM when the host has it, the GPU
  # for the shader chain and the guest's 3D.
  - --device=kvm
  - --device=dri
  # A gamepad (M13). `--device=dri` does not cover /dev/input, and
  # without this the player's gilrs source comes up seeing no controller
  # at all — silently, since a host with nothing plugged in looks the
  # same. `player --pads` inside the sandbox is what tells the two apart.
  - --device=input
  # Wayland first, X11 as the fallback the player's winit build expects.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  # QEMU's user-mode NAT gives the guest outbound networking, and the
  # shader-preset download fetches upstream's tarball.
  - --share=network
  # Disc images and qcow2s live wherever the user keeps them (an external
  # drive, a NAS mount), and a machine bundle stores absolute paths, so
  # they must resolve without a portal round-trip. This is why the
  # sandbox is nominal for this app — an honest `--filesystem=host` is
  # better than pretending otherwise with a narrower list that fails on
  # someone's second disk.
  - --filesystem=host

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/2ksbox/cargo
    # No uv in the SDK and no network during a Flathub build; the SDK's
    # own Python is 3.13, which is what QEMU 9.2.x wants
    # (scripts/configure-qemu.sh checks this rather than trusting it).
    QEMU_PYTHON: /usr/bin/python3

modules:
  # QEMU 9.2 needs libslirp for `-netdev user`, which every machine this
  # launcher generates uses, and the runtime has neither the library nor
  # its pkg-config file.
  - name: libslirp
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.4/libslirp-v4.9.4.tar.gz
        sha256: 3998863b020aeda34bddc567097c6efba55a78cdf6eeee6bcd42c11ef23967da

  # QEMU 9.2's mkvenv wants distlib, and takes pip's vendored copy as a
  # substitute — but pip 26 (what the SDK ships) has trimmed that copy:
  # `pip._vendor.distlib.scripts` is still there, `…distlib.version` is
  # gone, so mkvenv's import fails and configure dies with "found no
  # usable distlib". The real package satisfies its first choice. Build
  # dependency only, hence the cleanup — /app/lib/python3.13/site-packages
  # is on the venv's path (it inherits system site packages), which is
  # what makes this visible to QEMU's configure at all.
  - name: python3-distlib
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app distlib-0.4.3-py2.py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/02/08/9c41fb51ab5b43eb21674aff13df270e8ba6c4b29c8624e328dc7a9482af/distlib-0.4.3-py2.py3-none-any.whl
        sha256: 4b0ce306c966eb73bc3a7b6abad017c556dadd92c44701562cd528ac7fde4d5b

  - name: 2ksbox
    buildsystem: simple
    # No `--share=network`: the build is offline, as Flathub requires.
    # Every crate is a declared source with a checksum (cargo-sources.json,
    # regenerated by scripts/gen-flatpak-cargo-sources.sh), QEMU gets
    # `--disable-download` and has its meson wheel and softfloat
    # subprojects vendored in the submodule, and distlib is the module
    # above.
    sources:
      - type: dir
        path: ../..
        skip:
          # Build products and everything only a developer needs. The
          # QEMU submodule comes along *already patched*: the patch queue
          # (scripts/prepare-qemu.sh) needs git and rsync, neither of
          # which applies to a copied tree, so it runs on the host first
          # — and QEMU's own configure treats a tree with no .git as a
          # tarball build, which is exactly what we want here.
          - target
          # `launcher-qt` is its own cargo workspace, so it has its own
          # target/ — 3+ GB, and `target` above is a path from the source
          # root, not a name matched at every level.
          - launcher-qt/target
          - build
          - .git
          # `third_party/dxvk` used to be skipped here, when nothing in the
          # sandbox built it. It comes along now (63 MB, its subprojects
          # vendored and no meson wraps, so the build stays offline): the
          # Direct3D executor needs its `include/native` headers even to
          # compile, and the runtime's own libraries are what its d3d9 has
          # to link. Patched on the host, like the QEMU tree above.
          - third_party/slang-shaders
          - .claude
      # Every crate of both lock files (the workspace's and
      # `launcher-qt/`'s) as declared sources, unpacked into
      # `cargo/vendor` with a `cargo/config` that redirects crates-io at
      # them; `CARGO_HOME` above points at that directory.
      - cargo-sources.json
    build-commands:
      # The same three steps a developer runs, then the same staging
      # script the tarball uses — `<prefix>` is `/app`, so the install
      # layout needs no Flatpak-specific variant.
      - scripts/configure-qemu.sh --disable-download
      - ninja -C build/qemu qemu-img libqemu-embed-i386.so
      - cargo build --release --locked --offline -p player
      # `launcher-qt` is its own cargo workspace (ADR-015), so it is its
      # own build command; `CARGO_HOME` above points both at the one
      # vendored directory, which cargo-sources.json fills from both lock
      # files. cxx-qt-build finds Qt through `qmake6` in the SDK and
      # drives moc and qmltyperegistrar itself — there is no CMake step.
      - cd launcher-qt && cargo build --release --locked --offline
      # The Glide wrapper (doc 12 §5), built here for the same reason the
      # binaries above are: it links the runtime's libGL, not the host's.
      # Only the *compile* runs here — `third_party/openglide` arrives
      # already patched, exactly as the QEMU submodule does, because
      # `scripts/prepare-openglide.sh` needs the git checkout that this
      # copied tree is not. The SDK has GL/gl.h and libGL.so, which is all
      # it wants. Without this the sandbox's guests get no Glide at all:
      # `hw/3dfx` dlopens the library by name and finds nothing.
      - scripts/build-glide.sh
      # DXVK and the Direct3D executor (doc 14), for the same reason and
      # with the same constraint: the SDK has meson, ninja, glslang and
      # the Vulkan headers, DXVK's subprojects are vendored and it declares
      # no meson wrap, so this builds offline. Only `d3d9` and only against
      # patch 04's headless WSI — the executor never presents. No Vulkan
      # driver is packaged: the runtime's GL/Vulkan extension supplies the
      # host's, and a host below Vulkan 1.3 keeps GL + WineD3D (ADR-013).
      - scripts/configure-dxvk.sh
      - ninja -C build/dxvk
      - scripts/build-d3dpt-exec.sh
      - scripts/package-linux.sh --no-build --prefix /app
      # Flatpak exports these three by name, so they go where it looks
      # rather than through packaging/linux/install.sh (which rewrites
      # Exec/Icon to absolute paths for a plain prefix install; inside
      # the sandbox the shipped `Exec=2ksbox` / `Icon=<app-id>` are
      # already right).
      - install -Dm644 packaging/linux/com._2ksbox.Launcher.desktop /app/share/applications/com._2ksbox.Launcher.desktop
      - install -Dm644 packaging/linux/com._2ksbox.Launcher.metainfo.xml /app/share/metainfo/com._2ksbox.Launcher.metainfo.xml
      # The icon is a raster set, not one scalable file, so each size is
      # exported under its own directory. `package-linux.sh --prefix /app`
      # above already staged them; these are the same files put where
      # flatpak's export looks, and 128 is the size Flathub requires.
      - install -Dm644 packaging/icon/2ksbox-64.png /app/share/icons/hicolor/64x64/apps/com._2ksbox.Launcher.png
      - install -Dm644 packaging/icon/2ksbox-128.png /app/share/icons/hicolor/128x128/apps/com._2ksbox.Launcher.png
      - install -Dm644 packaging/icon/2ksbox-256.png /app/share/icons/hicolor/256x256/apps/com._2ksbox.Launcher.png
      - install -Dm644 packaging/icon/2ksbox-512.png /app/share/icons/hicolor/512x512/apps/com._2ksbox.Launcher.png
