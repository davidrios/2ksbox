[package]
name = "shader-chain"
version.workspace = true
edition.workspace = true
# `GPL-2.0-or-later`, not the workspace's `GPL-2.0-only` (ADR-009),
# because the launcher links this crate as well as the player, and a
# v2-only crate in the launcher binary would undo its licence. The player
# loses nothing: "or later" combines into its GPL-2.0-only whole.
license = "GPL-2.0-or-later"
description = "librashader (RetroArch slang) filter chain on wgpu, shared by the player (doc 03's CRT pass) and the launcher's shader profile preview (doc 07)."

[dependencies]
wgpu = "30"
librashader = { version = "0.12", default-features = false, features = ["runtime-wgpu", "presets", "preprocess", "reflect"] }
png = "0.18"
